<div *ngIf="mostrarLoading">
  <app-loading-messagge [messagge]="mensajeLoading"></app-loading-messagge>
</div>

<div class="row" *ngIf="mostrarBloqueo"></div>

<div *ngIf="!mostrarBloqueo">
  <br /><br />

  <div class="card">
    <h5 class="card-header text-center font-weight-bold text-uppercase">
      Administración de Usuarios
    </h5>
    <div class="card-body">
      <div class="usuarios-titulo-seccion text-center">
        Catálogo de Usuarios
      </div>
      <p class="text-muted text-center mb-3">
        Registro y mantenimiento de usuarios. Control de acceso, roles y
        sucursales.
      </p>

      <div class="row mb-3">
        <div class="col-md-4 offset-md-8 text-right">
          <button class="btn btn-block btn-usuario-primario" (click)="abrirNuevo()">
            + Nuevo usuario
          </button>
        </div>
      </div>

      <dx-data-grid
        [dataSource]="usuarios"
        [showBorders]="true"
        [columnAutoWidth]="true"
        [rowAlternationEnabled]="true"
        keyExpr="_id"
        (onExporting)="onExporting($event)"
        (onExported)="onExported($event)"
      >
        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-header-filter [visible]="true"></dxo-header-filter>
        <dxo-search-panel [visible]="true" [width]="240" placeholder="Buscar..."></dxo-search-panel>
        <dxo-export [enabled]="true" fileName="usuarios" [allowExportSelectedData]="true"></dxo-export>
        <dxi-column dataField="_id" caption="ID" [visible]="false"></dxi-column>
        <dxi-column dataField="name" caption="Nombre"></dxi-column>
        <dxi-column dataField="email" caption="Correo"></dxi-column>
        <dxi-column dataField="username" caption="Usuario"></dxi-column>
        <dxi-column dataField="rol" caption="Rol"></dxi-column>
        <dxi-column dataField="sucursal" caption="Sucursal"></dxi-column>
        <dxi-column dataField="status" caption="Estado"></dxi-column>
        <dxi-column
          caption="Acciones"
          cellTemplate="accionesUsuario"
          [width]="160"
          [allowFiltering]="false"
          [allowSorting]="false"
        ></dxi-column>

        <div *dxTemplate="let data of 'accionesUsuario'">
          <button class="btn btn-sm btn-primary mr-1" (click)="abrirEdicion(data.data)">
            Editar
          </button>
          <button class="btn btn-sm btn-danger" (click)="eliminarUsuario(data.data)">
            Eliminar
          </button>
        </div>

        <dxo-paging [pageSize]="8"></dxo-paging>
        <dxo-pager
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[8, 12, 20]"
          [showInfo]="true"
        ></dxo-pager>
      </dx-data-grid>
    </div>
  </div>
</div>

<dx-popup
  [(visible)]="popupVisible"
  [showTitle]="true"
  [title]="esEdicion ? 'Editar usuario' : 'Nuevo usuario'"
  [width]="700"
  [maxHeight]="'90vh'"
  [height]="'auto'"
  [showCloseButton]="true"
  [elementAttr]="{ class: 'popup-usuario-overlay' }"
>
  <div *dxTemplate="let data of 'content'" class="popup-usuario-body">
    <div class="popup-usuario-scroll p-3">
      <div class="usuarios-titulo-seccion text-center mb-3">
        Datos del usuario
      </div>

      <div class="row usuarios-formulario">
        <div class="col-md-6 mb-3">
          <label class="form-label">Nombre y apellido *</label>
          <dx-text-box
            [(value)]="usuario.name"
            placeholder="Nombre completo"
          ></dx-text-box>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Nombre de usuario *</label>
          <dx-text-box
            [(value)]="usuario.username"
            placeholder="Usuario de acceso"
            [readOnly]="esEdicion"
          ></dx-text-box>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Correo *</label>
          <dx-text-box
            [(value)]="usuario.email"
            placeholder="Correo electrónico"
          ></dx-text-box>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Contraseña{{ esEdicion ? '' : ' *' }}</label>
          <dx-text-box
            [(value)]="usuario.password"
            placeholder="Contraseña"
          ></dx-text-box>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Rol</label>
          <dx-select-box
            [items]="menu1"
            [(value)]="usuario.rol"
            placeholder="Seleccione un rol"
            (onValueChanged)="onRolChanged()"
          ></dx-select-box>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Sucursal</label>
          <dx-select-box
            [items]="locales"
            [(value)]="localAsignado"
            [searchEnabled]="true"
            valueExpr="sucursalTipo"
            displayExpr="sucursalTipo"
            placeholder="Seleccione sucursal"
          ></dx-select-box>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Código de facturación *</label>
          <dx-text-box
            [(value)]="usuario.codigoFacturacion"
            placeholder="Código"
          ></dx-text-box>
        </div>
        <div class="col-md-6 mb-3" *ngIf="esEdicion">
          <label class="form-label">Estado</label>
          <dx-select-box
            [items]="menuTipoDatos"
            [(value)]="usuario.status"
            placeholder="Estado"
          ></dx-select-box>
        </div>
        <div class="col-md-12 mb-3" *ngIf="esRolUsuario">
          <dx-check-box
            [(value)]="puedeAccederPagos"
            text="Puede acceder al Módulo de Pagos"
          ></dx-check-box>
        </div>
        <div class="col-md-6 mb-3" *ngIf="esRolUsuario && puedeAccederPagos">
          <label class="form-label">Código de acceso a Pagos *</label>
          <dx-text-box
            [(value)]="usuario.codigoAccesoPago"
            placeholder="Entre 5 y 10 dígitos"
            [maxLength]="10"
            mode="password"
            (onValueChanged)="onCodigoAccesoPagoChanged($event)"
          ></dx-text-box>
          <small class="text-muted">Obligatorio: mínimo 5 y máximo 10 dígitos.</small>
        </div>
      </div>
    </div>

    <div class="popup-usuario-footer px-3 pb-3">
      <div class="row mt-0">
        <div class="col-6">
          <button class="btn btn-block btn-secondary" (click)="cerrarPopup()">
            Cancelar
          </button>
        </div>
        <div class="col-6">
          <button class="btn btn-block btn-usuario-primario" (click)="guardarUsuario()">
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>
</dx-popup>
